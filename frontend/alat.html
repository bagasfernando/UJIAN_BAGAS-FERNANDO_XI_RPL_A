<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Alat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 text-sm font-sans">
  <div id="nav"></div>
  <div class="px-5 pt-3 pb-8">
    <h2 class="text-2xl font-bold mt-2">Sistem Peminjaman Alat</h2>
    <p class="text-gray-600 mb-3">Kelola data alat dan peminjaman</p>

    <h3 class="text-base font-bold mt-5 mb-1.5">Tambahkan Alat</h3>
    <div class="bg-white border border-gray-400 p-3">
      <div class="grid md:grid-cols-2 gap-x-4 gap-y-2.5">
        <div><label class="block font-bold mb-1" for="nama">Nama Alat</label>
          <input id="nama" class="w-full border border-gray-500 bg-white px-2 py-1.5" placeholder="Nama Alat"></div>
        <div><label class="block font-bold mb-1" for="kategori">Kategori</label>
          <select id="kategori" class="w-full border border-gray-500 bg-white px-2 py-1.5"></select></div>
        <div><label class="block font-bold mb-1" for="kondisi">Kondisi</label>
          <select id="kondisi" class="w-full border border-gray-500 bg-white px-2 py-1.5"><option>Baik</option><option>Rusak Ringan</option><option>Rusak Berat</option></select></div>
        <div><label class="block font-bold mb-1" for="stok">Stok</label>
          <input id="stok" type="number" min="0" class="w-full border border-gray-500 bg-white px-2 py-1.5" placeholder="Stok"></div>
        <div><label class="block font-bold mb-1" for="lokasi">Lokasi</label>
          <input id="lokasi" class="w-full border border-gray-500 bg-white px-2 py-1.5" placeholder="Lokasi penyimpanan"></div>
        <div class="flex items-end gap-1.5">
          <button id="btnTambah" class="bg-blue-600 hover:bg-blue-700 text-white border border-blue-800 rounded-sm px-3 py-1.5">+ Tambahkan Alat</button>
          <button id="btnReset" class="bg-gray-500 hover:bg-gray-600 text-white border border-gray-700 rounded-sm px-3 py-1.5">Reset</button>
        </div>
      </div>
      <p id="error" class="text-red-600 mt-1.5"></p>
    </div>

    <h3 class="text-base font-bold mt-5 mb-1">Data Alat</h3>
    <p class="text-gray-600 mb-1.5">Daftar alat yang bisa dipinjamkan (stok = jumlah yang tersedia saat ini)</p>
    <div class="overflow-x-auto">
      <table class="w-full border-collapse bg-white">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <dialog id="dlg" class="border-2 border-gray-600 p-0 w-[28rem] max-w-[92vw] backdrop:bg-black/40">
    <div class="p-4">
      <h3 class="text-base font-bold mb-1">Pinjam Alat</h3>
      <p id="dlgAlat" class="mb-3"></p>
      <div class="grid grid-cols-2 gap-2.5 mb-2">
        <div><label class="block font-bold mb-1" for="pPeminjam">Nama Peminjam</label>
          <input id="pPeminjam" class="w-full border border-gray-500 px-2 py-1.5"></div>
        <div><label class="block font-bold mb-1" for="pKelas">Kelas</label>
          <input id="pKelas" class="w-full border border-gray-500 px-2 py-1.5" placeholder="Contoh: XI TKJ 1"></div>
        <div><label class="block font-bold mb-1" for="pJumlah">Jumlah</label>
          <input id="pJumlah" type="number" min="1" value="1" class="w-full border border-gray-500 px-2 py-1.5"></div>
        <div><label class="block font-bold mb-1" for="pKembali">Tanggal Kembali</label>
          <input id="pKembali" type="date" class="w-full border border-gray-500 px-2 py-1.5"></div>
      </div>
      <p id="dlgError" class="text-red-600"></p>
      <div class="mt-3 text-right">
        <button id="dlgBatal" class="bg-gray-500 hover:bg-gray-600 text-white border border-gray-700 rounded-sm px-3 py-1.5">Batal</button>
        <button id="dlgSimpan" class="bg-blue-600 hover:bg-blue-700 text-white border border-blue-800 rounded-sm px-3 py-1.5">Simpan</button>
      </div>
    </div>
  </dialog>

 <script src="js/app.js"></script>
  <script>
    renderNav('alat');
    const $ = id => document.getElementById(id);
    let dataAlat = [], alatDipilih = null;

    $('thead').innerHTML = ['No', 'Nama Alat', 'Kategori', 'Kondisi', 'Stok', 'Lokasi', 'Aksi']
      .map(h => `<th class="${TH}">${h}</th>`).join('');

    async function muat() {
      try {
        const [alat, kat] = await Promise.all([api('/alat'), api('/kategori_alat')]);
        dataAlat = alat;
        const pilih = $('kategori').value;
        $('kategori').innerHTML = '<option value="">Pilih Kategori</option>' +
          kat.map(k => `<option value="${k.id_kategori}">${esc(k.nama_kategori)}</option>`).join('');
        $('kategori').value = pilih;
        const namaKat = Object.fromEntries(kat.map(k => [k.id_kategori, k.nama_kategori]));
        $('tbody').innerHTML = alat.length ? alat.map((a, i) => `<tr class="even:bg-gray-50">
          <td class="${TD}">${i + 1}</td>
          <td class="${TD}">${esc(a.nama_alat)}</td>
          <td class="${TD}">${esc(namaKat[a.id_kategori] || '-')}</td>
          <td class="${TD}">${esc(a.kondisi)}</td>
          <td class="${TD}">${a.stok}</td>
          <td class="${TD}">${esc(a.lokasi)}</td>
          <td class="${TD} whitespace-nowrap">
            <button data-pinjam="${a.id_alat}" ${a.stok < 1 ? 'disabled' : ''} class="${btn('biru', true)}">Pinjam</button>
            <button data-hapus="${a.id_alat}" class="${btn('merah', true)}">Hapus</button>
          </td></tr>`).join('')
          : `<tr><td colspan="7" class="${TD} text-center text-gray-500 py-4">Belum ada data alat.</td></tr>`;
      } catch (e) { notif(e.message); }
    }

    function resetForm() {
      ['nama', 'stok', 'lokasi'].forEach(i => $(i).value = '');
      $('kategori').value = ''; $('kondisi').value = 'Baik'; $('error').textContent = '';
    }

    $('btnTambah').onclick = async () => {
      const nama_alat = $('nama').value.trim(), id_kategori = $('kategori').value,
            stok = parseInt($('stok').value, 10), lokasi = $('lokasi').value.trim();
      if (!nama_alat || !id_kategori || isNaN(stok) || stok < 0 || !lokasi) {
        $('error').textContent = 'Semua kolom harus diisi.'; return;
      }
      try {
        await api('/alat', 'POST', { id_kategori: +id_kategori, nama_alat, kondisi: $('kondisi').value, stok, lokasi });
        resetForm(); notif('Alat berhasil ditambahkan.', true); muat();
      } catch (e) { $('error').textContent = e.message; }
    };
    $('btnReset').onclick = resetForm;

    $('tbody').onclick = async e => {
      const { hapus, pinjam } = e.target.dataset;
      if (hapus && confirm('Yakin hapus alat ini?')) {
        try { await api('/alat/' + hapus, 'DELETE'); notif('Alat berhasil dihapus.', true); muat(); }
        catch (err) { notif('Gagal menghapus: alat ini masih punya riwayat peminjaman.'); }
      }
      if (pinjam) {
        alatDipilih = dataAlat.find(a => a.id_alat == pinjam);
        $('dlgAlat').textContent = `${alatDipilih.nama_alat} (stok ${alatDipilih.stok})`;
        $('pPeminjam').value = ''; $('pKelas').value = ''; $('pJumlah').value = 1; $('pKembali').value = '';
        $('pKembali').min = today(); $('dlgError').textContent = ''; $('dlg').showModal();
      }
    };
    $('dlgBatal').onclick = () => $('dlg').close();
    $('dlgSimpan').onclick = async () => {
      const nama_peminjam = $('pPeminjam').value.trim(), kelas = $('pKelas').value.trim(),
            jumlah = parseInt($('pJumlah').value, 10), tanggal_kembali = $('pKembali').value;
      if (!nama_peminjam || !kelas || !tanggal_kembali || !(jumlah > 0)) {
        $('dlgError').textContent = 'Nama, kelas, jumlah, dan tanggal kembali harus diisi.'; return;
      }
      if (jumlah > alatDipilih.stok) { $('dlgError').textContent = `Jumlah melebihi stok (${alatDipilih.stok}).`; return; }
      try {
        await api('/peminjaman', 'POST', { id_alat: alatDipilih.id_alat, nama_peminjam, kelas, tanggal_kembali, jumlah });
        $('dlg').close(); notif('Peminjaman berhasil disimpan.', true); muat();
      } catch (e) { $('dlgError').textContent = e.message; }
    };

    muat();
  </script>
</body>
</html>
